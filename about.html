<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="About Abdulhannonov Azizillo: skills, technologies and journey."
        />
        <title>About | Azizillo</title>

        <script>
            try {
                document.documentElement.classList.add("js");
                document.documentElement.dataset.theme =
                    localStorage.getItem("theme") || "dark";
            } catch (e) {}
        </script>

        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/about.css" />
        <link rel="stylesheet" href="css/responsive.css" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    </head>
    <body data-title="meta.about">
        <div id="site-header"></div>

        <main>
            <section class="page-head">
                <div class="container">
                    <span class="section-label" data-i18n="about.label"></span>
                    <h1 data-i18n="about.title"></h1>
                </div>
            </section>

            <!-- ===== Intro ===== -->
            <section class="section">
                <div class="container about__grid">
                    <div class="about__photo reveal">
                        <img
                            src="assets/images/me.jpg"
                            alt="Azizillo Abdulhannonov"
                        />
                    </div>

                    <div class="about__content reveal">
                        <h2 data-i18n="about.hello"></h2>
                        <p data-i18n="about.p1"></p>
                        <p data-i18n="about.p2"></p>
                        <p data-i18n="about.p3"></p>
                    </div>
                </div>
            </section>

            <!-- ===== Skills ===== -->
            <section class="section">
                <div class="container">
                    <div class="section-head reveal">
                        <span
                            class="section-label"
                            data-i18n="about.skillsLabel"
                        ></span>
                        <h2 data-i18n="about.skillsTitle"></h2>
                    </div>

                    <div class="skills__grid">
                        <article class="card reveal">
                            <h3 data-i18n="about.frontend"></h3>
                            <div class="tags">
                                <span class="tag">HTML5</span>
                                <span class="tag">CSS3</span>
                                <span class="tag">JavaScript</span>
                            </div>
                        </article>

                        <article class="card reveal">
                            <h3 data-i18n="about.design"></h3>
                            <div class="tags">
                                <span class="tag">Responsive</span>
                                <span class="tag">Flexbox</span>
                                <span class="tag">Grid</span>
                                <span class="tag">Animations</span>
                            </div>
                        </article>

                        <article class="card reveal">
                            <h3 data-i18n="about.tools"></h3>
                            <div class="tags">
                                <span class="tag">Git</span>
                                <span class="tag">Git Bash</span>
                                <span class="tag">VS Code</span>
                                <span class="tag">Vercel</span>
                            </div>
                        </article>
                    </div>
                </div>
            </section>

            <!-- ===== Journey ===== -->
            <section class="section">
                <div class="container">
                    <div class="section-head reveal">
                        <span
                            class="section-label"
                            data-i18n="about.journeyLabel"
                        ></span>
                        <h2 data-i18n="about.journeyTitle"></h2>
                    </div>

                    <div class="timeline">
                        <div class="timeline__item reveal">
                            <span
                                class="timeline__date"
                                data-i18n="about.step1"
                            ></span>
                            <h3 data-i18n="about.s1t"></h3>
                            <p data-i18n="about.s1p"></p>
                        </div>

                        <div class="timeline__item reveal">
                            <span
                                class="timeline__date"
                                data-i18n="about.step2"
                            ></span>
                            <h3 data-i18n="about.s2t"></h3>
                            <p data-i18n="about.s2p"></p>
                        </div>

                        <div class="timeline__item reveal">
                            <span
                                class="timeline__date"
                                data-i18n="about.step3"
                            ></span>
                            <h3 data-i18n="about.s3t"></h3>
                            <p data-i18n="about.s3p"></p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="js/translations/en.js"></script>
        <script src="js/translations/ru.js"></script>
        <script src="js/translations/uz.js"></script>
        <script src="js/translations/ky.js"></script>
        <script src="js/navigation.js"></script>
        <script src="js/projects.js"></script>
        <script src="js/language.js"></script>
        <script src="js/main.js"></script>
        <script src="js/animations.js"></script>
        <script src="js/contact.js"></script>
    </body>
</html>
