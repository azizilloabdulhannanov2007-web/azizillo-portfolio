<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Resume of Abdulhannonov Azizillo: education, experience, skills and certificates."
        />
        <title>Resume | Azizillo</title>

        <script>
            try {
                document.documentElement.classList.add("js");
                document.documentElement.dataset.theme =
                    localStorage.getItem("theme") || "dark";
            } catch (e) {}
        </script>

        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/resume.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </head>
    <body data-title="meta.resume">
        <div id="site-header"></div>

        <main>
            <section class="page-head">
                <div class="container">
                    <span class="section-label" data-i18n="res.label"></span>
                    <h1 data-i18n="res.title"></h1>
                    <p data-i18n="res.text"></p>

                    <div class="resume__actions">
                        <a
                            href="assets/documents/resume.pdf"
                            class="btn btn-primary"
                            target="_blank"
                            rel="noopener"
                            data-i18n="res.view"
                        ></a>
                        <a
                            href="assets/documents/resume.pdf"
                            class="btn btn-outline"
                            download
                            data-i18n="res.download"
                        ></a>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="container resume__grid">
                    <div class="resume__main">
                        <div class="resume__block">
                            <h2 data-i18n="res.exp"></h2>
                            <div class="timeline">
                                <div class="timeline__item reveal">
                                    <span
                                        class="timeline__date"
                                        data-i18n="res.e1.date"
                                    ></span>
                                    <h3 data-i18n="res.e1.title"></h3>
                                    <p data-i18n="res.e1.text"></p>
                                </div>

                                <div class="timeline__item reveal">
                                    <span
                                        class="timeline__date"
                                        data-i18n="res.e2.date"
                                    ></span>
                                    <h3 data-i18n="res.e2.title"></h3>
                                    <p data-i18n="res.e2.text"></p>
                                </div>
                            </div>
                        </div>

                        <div class="resume__block">
                            <h2 data-i18n="res.edu"></h2>
                            <div class="timeline">
                                <div class="timeline__item reveal">
                                    <span
                                        class="timeline__date"
                                        data-i18n="res.d1.date"
                                    ></span>
                                    <h3 data-i18n="res.d1.title"></h3>
                                    <p data-i18n="res.d1.text"></p>
                                </div>

                                <div class="timeline__item reveal">
                                    <span
                                        class="timeline__date"
                                        data-i18n="res.d2.date"
                                    ></span>
                                    <h3 data-i18n="res.d2.title"></h3>
                                    <p data-i18n="res.d2.text"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <aside class="resume__side">
                        <div class="card reveal">
                            <h3 data-i18n="res.skills"></h3>
                            <div class="tags">
                                <span class="tag">HTML5</span>
                                <span class="tag">CSS3</span>
                                <span class="tag">JavaScript</span>
                                <span class="tag">Git</span>
                                <span class="tag">Responsive Design</span>
                                <span class="tag">Vercel</span>
                            </div>
                        </div>

                        <div class="card reveal">
                            <h3 data-i18n="res.languages"></h3>
                            <ul class="info-list">
                                <li>
                                    <strong data-i18n="res.lang.en"></strong
                                    ><span data-i18n="res.lvl.mid"></span>
                                </li>
                                <li>
                                    <strong data-i18n="res.lang.ru"></strong
                                    ><span data-i18n="res.lvl.fluent"></span>
                                </li>
                                <li>
                                    <strong data-i18n="res.lang.uz"></strong
                                    ><span data-i18n="res.lvl.native"></span>
                                </li>
                                <li>
                                    <strong data-i18n="res.lang.ky"></strong
                                    ><span data-i18n="res.lvl.fluent"></span>
                                </li>
                            </ul>
                        </div>

                        <div class="card reveal">
                            <h3 data-i18n="res.certs"></h3>
                            <ul class="info-list">
                                <li>
                                    <strong data-i18n="res.c1"></strong
                                    ><span>2025</span>
                                </li>
                                <li>
                                    <strong data-i18n="res.c2"></strong
                                    ><span>2026</span>
                                </li>
                            </ul>
                        </div>
                    </aside>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="js/translations/en.js"></script>
        <script src="js/translations/ru.js"></script>
        <script src="js/translations/uz.js"></script>
        <script src="js/translations/ky.js"></script>
        <script src="js/navigation.js"></script>
        <script src="js/projects.js"></script>
        <script src="js/language.js"></script>
        <script src="js/main.js"></script>
        <script src="js/animations.js"></script>
        <script src="js/contact.js"></script>
    </body>
</html>
