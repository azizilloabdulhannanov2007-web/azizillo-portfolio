<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Projects by Abdulhannonov Azizillo: websites and web apps built with HTML, CSS and JavaScript."
        />
        <title>Projects | Azizillo</title>

        <script>
            try {
                document.documentElement.classList.add("js");
                document.documentElement.dataset.theme =
                    localStorage.getItem("theme") || "dark";
            } catch (e) {}
        </script>

        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/projects.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </head>
    <body data-title="meta.projects">
        <div id="site-header"></div>

        <main>
            <section class="page-head">
                <div class="container">
                    <span
                        class="section-label"
                        data-i18n="projects.label"
                    ></span>
                    <h1 data-i18n="projects.title"></h1>
                    <p data-i18n="projects.text"></p>
                </div>
            </section>

            <section class="section">
                <div class="container">
                    <div class="projects__grid" id="projects-grid"></div>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="js/translations/en.js"></script>
        <script src="js/translations/ru.js"></script>
        <script src="js/translations/uz.js"></script>
        <script src="js/translations/ky.js"></script>
        <script src="js/navigation.js"></script>
        <script src="js/projects.js"></script>
        <script src="js/language.js"></script>
        <script src="js/main.js"></script>
        <script src="js/animations.js"></script>
        <script src="js/contact.js"></script>
    </body>
</html>
