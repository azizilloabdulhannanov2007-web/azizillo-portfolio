<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Personal portfolio of Abdulhannonov Azizillo, Frontend Developer."
        />
        <title>Azizillo | Frontend Developer</title>

        <script>
            try {
                document.documentElement.classList.add("js");
                document.documentElement.dataset.theme =
                    localStorage.getItem("theme") || "dark";
            } catch (e) {}
        </script>

        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/home.css" />
        <link rel="stylesheet" href="css/responsive.css" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    </head>
    <body data-title="meta.home">
        <div id="site-header"></div>

        <main>
            <!-- ===== Hero ===== -->
            <section class="hero">
                <div class="container hero__grid">
                    <div class="hero__content">
                        <span class="hero__badge" data-i18n="home.badge"
                            >Available for work</span
                        >
                        <h1 class="hero__title" data-i18n-html="home.title">
                            Hi, I'm <span>Azizillo</span>
                        </h1>
                        <p class="hero__role" data-i18n="home.role">
                            Frontend Developer
                        </p>
                        <p class="hero__text" data-i18n="home.text"></p>

                        <div class="hero__actions">
                            <a
                                href="projects.html"
                                class="btn btn-primary"
                                data-i18n="home.viewProjects"
                            ></a>
                            <a
                                href="contact.html"
                                class="btn btn-outline"
                                data-i18n="home.contactMe"
                            ></a>
                        </div>

                        <div class="tags">
                            <span class="tag">HTML5</span>
                            <span class="tag">CSS3</span>
                            <span class="tag">JavaScript</span>
                            <span class="tag">Git</span>
                        </div>
                    </div>

                    <div class="hero__visual">
                        <div class="hero__avatar" aria-hidden="true">AA</div>
                    </div>
                </div>
            </section>

            <!-- ===== Featured Projects ===== -->
            <section class="section featured">
                <div class="container">
                    <div class="section-head reveal">
                        <span
                            class="section-label"
                            data-i18n="home.featLabel"
                        ></span>
                        <h2 data-i18n="home.featTitle"></h2>
                        <p class="section-text" data-i18n="home.featText"></p>
                    </div>

                    <div class="featured__grid" id="featured-grid"></div>

                    <div class="featured__more">
                        <a
                            href="projects.html"
                            class="btn btn-outline"
                            data-i18n="home.allProjects"
                        ></a>
                    </div>
                </div>
            </section>

            <!-- ===== CTA ===== -->
            <section class="section">
                <div class="container">
                    <div class="cta reveal">
                        <h2 data-i18n="home.ctaTitle"></h2>
                        <p data-i18n="home.ctaText"></p>
                        <a
                            href="contact.html"
                            class="btn btn-primary"
                            data-i18n="home.ctaBtn"
                        ></a>
                    </div>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="js/translations/en.js"></script>
        <script src="js/translations/ru.js"></script>
        <script src="js/translations/uz.js"></script>
        <script src="js/translations/ky.js"></script>
        <script src="js/navigation.js"></script>
        <script src="js/projects.js"></script>
        <script src="js/language.js"></script>
        <script src="js/main.js"></script>
        <script src="js/animations.js"></script>
        <script src="js/contact.js"></script>
    </body>
</html>
