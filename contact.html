<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Contact Abdulhannonov Azizillo: send a message via the form, Telegram or email."
        />
        <title>Contact | Azizillo</title>

        <script>
            try {
                document.documentElement.classList.add("js");
                document.documentElement.dataset.theme =
                    localStorage.getItem("theme") || "dark";
            } catch (e) {}
        </script>

        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/contact.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </head>
    <body data-title="meta.contact">
        <div id="site-header"></div>

        <main>
            <section class="page-head">
                <div class="container">
                    <span class="section-label" data-i18n="con.label"></span>
                    <h1 data-i18n="con.title"></h1>
                    <p data-i18n="con.text"></p>
                </div>
            </section>

            <section class="section">
                <div class="container contact__grid">
                    <div class="contact__info card reveal">
                        <h2 data-i18n="con.infoTitle"></h2>
                        <p data-i18n="con.infoText"></p>

                        <ul class="contact__list">
                            <li>
                                <span
                                    class="contact__label"
                                    data-i18n="con.email"
                                ></span>
                                <a href="mailto:your@email.com"
                                    >your@email.com</a
                                >
                            </li>
                            <li>
                                <span
                                    class="contact__label"
                                    data-i18n="con.telegram"
                                ></span>
                                <a href="#" target="_blank" rel="noopener"
                                    >@username</a
                                >
                            </li>
                            <li>
                                <span
                                    class="contact__label"
                                    data-i18n="con.github"
                                ></span>
                                <a href="#" target="_blank" rel="noopener"
                                    >github.com/username</a
                                >
                            </li>
                            <li>
                                <span
                                    class="contact__label"
                                    data-i18n="con.linkedin"
                                ></span>
                                <a href="#" target="_blank" rel="noopener"
                                    >linkedin.com/in/username</a
                                >
                            </li>
                            <li>
                                <span
                                    class="contact__label"
                                    data-i18n="con.location"
                                ></span>
                                <span data-i18n="con.locationValue"></span>
                            </li>
                        </ul>
                    </div>

                    <div class="contact__form card reveal">
                        <h2 data-i18n="con.formTitle"></h2>

                        <form id="contact-form" class="form" novalidate>
                            <div class="form__row">
                                <div class="form__group">
                                    <label
                                        for="fullname"
                                        data-i18n="con.fullname"
                                    ></label>
                                    <input
                                        type="text"
                                        id="fullname"
                                        name="fullname"
                                        data-i18n-placeholder="con.fullnamePh"
                                        autocomplete="name"
                                        maxlength="100"
                                    />
                                    <small
                                        class="form__error"
                                        id="fullname-error"
                                    ></small>
                                </div>

                                <div class="form__group">
                                    <label
                                        for="email"
                                        data-i18n="con.emailLabel"
                                    ></label>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        data-i18n-placeholder="con.emailPh"
                                        autocomplete="email"
                                        maxlength="150"
                                    />
                                    <small
                                        class="form__error"
                                        id="email-error"
                                    ></small>
                                </div>
                            </div>

                            <div class="form__group">
                                <label
                                    for="subject"
                                    data-i18n="con.subject"
                                ></label>
                                <input
                                    type="text"
                                    id="subject"
                                    name="subject"
                                    data-i18n-placeholder="con.subjectPh"
                                    maxlength="150"
                                />
                                <small
                                    class="form__error"
                                    id="subject-error"
                                ></small>
                            </div>

                            <div class="form__group">
                                <label
                                    for="message"
                                    data-i18n="con.message"
                                ></label>
                                <textarea
                                    id="message"
                                    name="message"
                                    data-i18n-placeholder="con.messagePh"
                                    maxlength="3000"
                                ></textarea>
                                <small
                                    class="form__error"
                                    id="message-error"
                                ></small>
                            </div>

                            <!-- Honeypot: odam ko'rmaydi, botlar to'ldiradi -->
                            <input
                                type="text"
                                name="website"
                                class="hp"
                                tabindex="-1"
                                autocomplete="off"
                                aria-hidden="true"
                            />

                            <p
                                id="form-status"
                                class="form__status"
                                aria-live="polite"
                            ></p>

                            <button
                                type="submit"
                                class="btn btn-primary"
                                data-i18n="con.send"
                            ></button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="js/translations/en.js"></script>
        <script src="js/translations/ru.js"></script>
        <script src="js/translations/uz.js"></script>
        <script src="js/translations/ky.js"></script>
        <script src="js/navigation.js"></script>
        <script src="js/projects.js"></script>
        <script src="js/language.js"></script>
        <script src="js/main.js"></script>
        <script src="js/animations.js"></script>
        <script src="js/contact.js"></script>
    </body>
</html>
